<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planos de Aula — The Match Champ</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--black:#080E16;--navy:#0D1B2A;--gold:#D4A017;--white:#F5F5F0;--gray:#8A8A8A;--border:rgba(212,160,23,.2)}
    body{background:var(--black);color:var(--white);font-family:'Barlow',sans-serif;min-height:100vh}

    header{background:var(--navy);border-bottom:2px solid var(--gold);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo{display:flex;align-items:center;gap:14px}
    .logo img{height:48px;filter:brightness(0) invert(1)}
    .logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
    .logo-text span{color:var(--gold)}
    .back-btn{color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:1px;border:1px solid var(--border);padding:8px 16px;border-radius:8px;transition:.2s}
    .back-btn:hover{background:rgba(212,160,23,.1)}

    .hero{text-align:center;padding:60px 24px 40px}
    .hero-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);background:rgba(212,160,23,.1);border:1px solid var(--border);padding:6px 16px;border-radius:20px;margin-bottom:20px}
    .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,64px);letter-spacing:2px;margin-bottom:16px}
    .hero p{color:var(--gray);font-size:16px;max-width:560px;margin:0 auto}

    .lang-toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin:32px auto}
    .lang-btn{padding:10px 28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--gray);font-family:'Barlow',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.5px}
    .lang-btn.active{background:var(--gold);border-color:var(--gold);color:#000}
    .lang-btn:hover:not(.active){border-color:rgba(212,160,23,.5);color:var(--white)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1100px;margin:0 auto;padding:0 24px 60px}

    .card{background:#0d1520;border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.25s;cursor:pointer;text-decoration:none;display:block}
    .card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 12px 40px rgba(212,160,23,.15)}
    .card-icon{background:linear-gradient(135deg,#0d1b2a,#1a2d42);height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;border-bottom:1px solid var(--border)}
    .card-body{padding:20px}
    .card-tag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    .card-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin-bottom:8px;color:var(--white)}
    .card-desc{font-size:13px;color:var(--gray);line-height:1.5}
    .card-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .card-level{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray)}
    .card-arrow{color:var(--gold);font-size:18px}

    @media(max-width:600px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <a href="biblioteca.html" style="display:flex;align-items:center;gap:14px;text-decoration:none">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)">TMC</div>
      <div class="logo-text">The Match Champ <span>Jiu-Jitsu</span></div>
    </a>
  </div>
  <a href="biblioteca.html" class="back-btn">← Voltar</a>
</header>

<div class="hero">
  <div class="hero-badge" id="badge">Material Exclusivo</div>
  <h1 id="title">Planos de Aula TMC</h1>
  <p id="subtitle">Conteúdo didático oficial para professores credenciados. Selecione o programa correspondente à sua turma.</p>
</div>

<div class="lang-toggle">
  <button class="lang-btn active" onclick="setLang('pt',this)">🇧🇷 Português</button>
  <button class="lang-btn" onclick="setLang('en',this)">🇺🇸 English</button>
</div>

<div class="grid" id="grid"></div>

<script>
var BASE = 'https://dickbnu-hub.github.io/tmc-site/';

var PLANOS = {
  pt: [
    {icon:'👶',tag:'Baby',title:'Baby 3 a 6 anos',desc:'Programa de aula para a turma Baby, crianças de 3 a 6 anos. Atividades lúdicas e fundamentos do Jiu-Jitsu.',level:'Iniciante',file:'Programa de Aula - Pportugues-PDF/BRA-BABY_3-6.pdf'},
    {icon:'🧒',tag:'Kids',title:'Kids 7 a 11 anos',desc:'Programa de aula para a turma Kids, crianças de 7 a 11 anos. Técnicas básicas e desenvolvimento.',level:'Iniciante',file:'Programa de Aula - Pportugues-PDF/BRA-Kids_7-11.pdf'},
    {icon:'🧑',tag:'Teens',title:'Teens 12 a 15 anos',desc:'Programa de aula para a turma Teens, adolescentes de 12 a 15 anos. Técnicas intermediárias.',level:'Intermediário',file:'Programa de Aula - Pportugues-PDF/BRA-Teens_12-15.pdf'},
    {icon:'🥋',tag:'Fundamentos',title:'Fundamentos Adulto',desc:'Programa de fundamentos para adultos iniciantes. Base técnica completa do Jiu-Jitsu TMC.',level:'Iniciante',file:'Programa de Aula - Pportugues-PDF/BRA-Fundamentos.pdf'},
    {icon:'🏆',tag:'Avançado',title:'Avançado Adulto',desc:'Programa avançado para adultos. Técnicas de alto nível para atletas e faixas coloridas avançadas.',level:'Avançado',file:'Programa de Aula - Pportugues-PDF/BRA-Avancado_Adulto.pdf'},
    {icon:'⚡',tag:'No-Gi',title:'No-Gi Adulto',desc:'Programa de No-Gi para adultos. Técnicas sem kimono para competição e treino funcional.',level:'Intermediário',file:'Programa de Aula - Pportugues-PDF/BRA-NoGi_Adulto.pdf'},
    {icon:'🤸',tag:'No-Gi Kids',title:'No-Gi Kids 6 a 12 anos',desc:'Programa de No-Gi para crianças de 6 a 12 anos. Treino sem kimono adaptado para a faixa etária.',level:'Iniciante',file:'Programa de Aula - Pportugues-PDF/BRA-NoGi_Kids_6-12.pdf'},
  ],
  en: [
    {icon:'👶',tag:'Baby',title:'Baby 3 to 6 years',desc:'Class program for the Baby group, children aged 3 to 6. Playful activities and Jiu-Jitsu fundamentals.',level:'Beginner',file:'Programa de aula Ingles- PDF/USA-Baby_3-6.pdf'},
    {icon:'🧒',tag:'Kids',title:'Kids 7 to 11 years',desc:'Class program for the Kids group, children aged 7 to 11. Basic techniques and development.',level:'Beginner',file:'Programa de aula Ingles- PDF/USA-Kids_7-11.pdf'},
    {icon:'🧑',tag:'Teens',title:'Teens 12 to 15 years',desc:'Class program for the Teens group, aged 12 to 15. Intermediate techniques.',level:'Intermediate',file:'Programa de aula Ingles- PDF/USA-Teens_12-15.pdf'},
    {icon:'🥋',tag:'Fundamentals',title:'Adult Fundamentals',desc:'Fundamentals program for adult beginners. Complete technical base of TMC Jiu-Jitsu.',level:'Beginner',file:'Programa de aula Ingles- PDF/USA-Fundamentals.pdf'},
    {icon:'🏆',tag:'Advanced',title:'Adult Advanced',desc:'Advanced program for adults. High-level techniques for athletes and advanced colored belts.',level:'Advanced',file:'Programa de aula Ingles- PDF/USA-Avancado_Adulto.pdf'},
    {icon:'⚡',tag:'No-Gi',title:'No-Gi Adult',desc:'No-Gi program for adults. Techniques without kimono for competition and functional training.',level:'Intermediate',file:'Programa de aula Ingles- PDF/USA-NoGi_Adult.pdf'},
    {icon:'🤸',tag:'No-Gi Kids',title:'No-Gi Kids 6 to 12',desc:'No-Gi program for children aged 6 to 12. Training without kimono adapted for the age group.',level:'Beginner',file:'Programa de aula Ingles- PDF/USA-NoGi_KIDS_6-12.pdf'},
  ]
};

var TEXTS = {
  pt:{badge:'Material Exclusivo',title:'Planos de Aula TMC',subtitle:'Conteúdo didático oficial para professores credenciados. Selecione o programa correspondente à sua turma.'},
  en:{badge:'Exclusive Content',title:'TMC Class Programs',subtitle:'Official teaching content for affiliated professors. Select the program for your class group.'}
};

var currentLang = 'pt';

function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  var t = TEXTS[lang];
  document.getElementById('badge').textContent = t.badge;
  document.getElementById('title').textContent = t.title;
  document.getElementById('subtitle').textContent = t.subtitle;
  renderGrid();
}

function renderGrid() {
  var planos = PLANOS[currentLang];
  document.getElementById('grid').innerHTML = planos.map(function(p) {
    var url = BASE + encodeURIComponent(p.file).replace(/%2F/g,'/');
    return '<a class="card" href="ebooks.html?file=' + encodeURIComponent(p.file) + '&title=' + encodeURIComponent(p.title) + '">'
      + '<div class="card-icon">' + p.icon + '</div>'
      + '<div class="card-body">'
        + '<div class="card-tag">' + p.tag + '</div>'
        + '<div class="card-title">' + p.title + '</div>'
        + '<div class="card-desc">' + p.desc + '</div>'
      + '</div>'
      + '<div class="card-footer">'
        + '<span class="card-level">' + p.level + '</span>'
        + '<span class="card-arrow">→</span>'
      + '</div>'
    + '</a>';
  }).join('');
}

renderGrid();
</script>
</body>
</html>
